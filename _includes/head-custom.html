{% if site.color_mode.toggle %}
  <script>
    window.__COLOR_MODE_DEFAULT__ = "{{ site.color_mode.default | default: 'auto' }}";
  </script>

  <!-- Load the theme engine -->
  <script src="{{ '/assets/js/color-mode.js' | relative_url }}" defer></script>

  <!-- Create (or wire) the Auto/Light/Dark control -->
  <script defer>
    (function () {
      function ready(fn) {
        if (document.readyState !== "loading") fn();
        else document.addEventListener("DOMContentLoaded", fn);
      }

      ready(function () {
        // If the JS didn't load for some reason, fail silently.
        if (!window.__colorMode) return;

        // Reuse an existing toggle if you already have one on the page.
        var host = document.querySelector(".color-mode-toggle");

        // If you have a button already but it isn't a <select>, we still create a robust dropdown.
        if (!host || !host.querySelector("select")) {
          if (!host) {
            host = document.createElement("div");
            host.className = "color-mode-toggle";
            document.body.appendChild(host);
          }
          host.innerHTML =
            'Theme: ' +
            '<select aria-label="Theme">' +
            '  <option value="auto">Auto</option>' +
            '  <option value="light">Light</option>' +
            '  <option value="dark">Dark</option>' +
            '</select>';
        }

        var select = host.querySelector("select");
        var sync = function () { select.value = window.__colorMode.getMode(); };

        sync();
        select.addEventListener("change", function (e) {
          window.__colorMode.setMode(e.target.value);
        });

        // Keep in sync if something else changes it (another tab, etc.)
        window.addEventListener("storage", function (e) {
          if (e.key === "color-mode") sync();
        });
      });
    })();
  </script>
{% endif %}
